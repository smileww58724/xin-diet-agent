services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: diet_agent
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-diet123456}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-diet123456}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD:-diet123456}
      REDIS_HOST: redis
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请先在环境变量或 .env 中设置 DEEPSEEK_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-please-change-0123456789}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql-data:
