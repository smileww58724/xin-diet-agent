spring:
  application:
    name: diet-agent

  datasource:
    url: jdbc:mysql://localhost:3306/diet_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

pexels:
  api-key: ${PEXELS_API_KEY:}

logging:
  level:
    com.dietagent: DEBUG
    org.springframework.ai: DEBUG
