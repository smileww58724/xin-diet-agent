server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 后端接口同源代理：容器网络内直连 backend 服务，浏览器侧无跨域
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        # SSE 流式响应：关闭缓冲保证打字机效果实时，放宽读超时覆盖长回答
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 前端路由 history 模式回退
    location / {
        try_files $uri /index.html;
    }
}
